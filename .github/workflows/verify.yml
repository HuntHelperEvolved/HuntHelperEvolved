name: Verify plugin
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  plugin:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check that local tests are not published
        shell: pwsh
        run: |
          $localTests = @(git ls-files -- tests/)
          if ($localTests.Count -gt 0) { throw "Keep the test suite local; do not publish tests/." }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Get official Dalamud development assemblies
        shell: pwsh
        run: |
          Invoke-WebRequest https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile "$env:RUNNER_TEMP/dalamud.zip"
          Expand-Archive "$env:RUNNER_TEMP/dalamud.zip" "$env:RUNNER_TEMP/dalamud"
          "DALAMUD_HOME=$env:RUNNER_TEMP/dalamud" >> $env:GITHUB_ENV
      - run: dotnet build HuntHelperEvolved.csproj -c Release
      - shell: bash
        run: dotnet list HuntHelperEvolved.csproj package --vulnerable --include-transitive --format json > audit.json
      - run: python scripts/check-audit.py audit.json
      - run: python scripts/package-testing.py bin/Release/HuntHelperEvolved/latest.zip HuntHelperEvolved-testing.zip
